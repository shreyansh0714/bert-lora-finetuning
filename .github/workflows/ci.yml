name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only the from-scratch LoRA module (src/) is tested here — it depends on torch alone.
      # The comparison notebooks need the full transformers/peft/datasets stack and a GPU
      # to run in reasonable time, so they're run manually on Colab/Kaggle, not in CI.
      - name: Install minimal deps
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu pytest

      - name: Run from-scratch LoRA tests
        run: pytest tests/ -v
